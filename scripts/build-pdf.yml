name: Build CV & Portfolio PDF

# Setiap kali index.html (atau foto di assets/) berubah, CV dan Portofolio PDF dibuat ulang otomatis.
on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/build_pdf.mjs'
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: write      # supaya PDF hasilnya bisa disimpan kembali ke repo

concurrency:
  group: build-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build PDF
        run: node scripts/build_pdf.mjs

      - name: Commit PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV_Friska_Yani_Natalia_Hutasoit.pdf Portfolio_Friska_Yani_Natalia_Hutasoit.pdf
          if git diff --cached --quiet; then
            echo "PDF tidak berubah."
          else
            git commit -m "chore: perbarui CV & Portofolio PDF otomatis"
            git pull --rebase
            git push
          fi
